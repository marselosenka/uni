---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: greeting-controller

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: greeting-controller-role
rules:
  - apiGroups: ["hy548.csd.uoc.gr"]
    resources: ["greetings"]
    verbs: ["get", "list", "watch", "patch", "update"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: greeting-controller-binding
subjects:
  - kind: ServiceAccount
    name: greeting-controller
    namespace: default
roleRef:
  kind: ClusterRole
  name: greeting-controller-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeting-controller
  template:
    metadata:
      labels:
        app: greeting-controller
    spec:
      serviceAccountName: greeting-controller
      containers:
        - name: controller
          image: marselosenka/greeting-controller:1.0
          imagePullPolicy: Always